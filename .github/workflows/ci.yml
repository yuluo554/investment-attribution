name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Selftest (python -m form)
        run: python -m investment_attribution selftest --strict

      - name: Selftest (console script form)
        run: investment-attribution selftest --strict

      - name: Stage-not-ready contract
        shell: bash
        run: |
          set +e
          python -m investment_attribution import x.csv
          code=$?
          test "$code" = "3"
