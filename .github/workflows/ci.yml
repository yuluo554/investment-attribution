name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# 只读权限：本工作流只跑测试与门禁，不写仓库任何东西。
permissions:
  contents: read

# 同一 ref 的并发推送取消旧 run（`tag push` 与分支 push 各自独立计）：
# 排队中的旧 run 对新提交没有意义，且省 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # 脱敏扫描的"历史面"要遍历全部可达对象；浅克隆只给 tip 树，
          # 历史面会静默缩水成"只扫了最新一版"——那正是假绿。
          fetch-depth: 0

      - name: Restore annotated tag objects (checkout leaves a lightweight tag ref)
        shell: bash
        run: |
          # actions/checkout 对 tag 事件执行的是
          #   git fetch --no-tags origin +<commit>:refs/tags/<tag>
          # 于是 tag ref 直接指向 commit——标注 tag 对象根本没进本地库，
          # 脱敏扫描的历史/元数据两面就看不到 tagger（实测踩到：tag run 报
          # "history hits=0" 却并非因为历史干净，而是因为对象不在）。
          # 这里按 refspec 强制重取，并要求"ref 上的对象确实是 tag"，
          # 防止它再次静默降级成"扫了但没扫到"。
          if git ls-remote --tags --exit-code origin >/dev/null 2>&1; then
            git fetch --force --no-recurse-submodules origin '+refs/tags/*:refs/tags/*'
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="refs/tags/$GITHUB_REF_NAME"
            test "$(git cat-file -t "$ref")" = "tag"
            git for-each-ref --format='tagger=%(taggername) <%(taggeremail)>' "$ref"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Privacy scan (four surfaces, 0 hits)
        run: |
          python tools/scan_privacy.py --self-test
          python tools/scan_privacy.py --all

      - name: Selftest (python -m form)
        run: python -m investment_attribution selftest --strict

      - name: Selftest (console script form)
        run: investment-attribution selftest --strict

      - name: Generated data gate (shape + byte identity)
        run: python tools/gen_data.py --check

      - name: Import smoke (two real formats)
        run: python -m investment_attribution import data/samples/htsec-demo-001.xlsx data/samples/huaxi-demo-001.xls --out-dir out/

      - name: Cost smoke (both methods)
        run: |
          python -m investment_attribution cost --method fifo --ledger out/ledger.json --out-dir out/fifo
          python -m investment_attribution cost --method wavg --ledger out/ledger.json --out-dir out/wavg
          python -m investment_attribution pnl --method fifo --ledger out/ledger.json --out-dir out/fifo --fees

      - name: Cost method is mandatory (exit 2)
        shell: bash
        run: |
          set +e
          python -m investment_attribution cost --ledger out/ledger.json
          code=$?
          test "$code" = "2"

      - name: Corporate-actions smoke (both methods; exit 1 = pending queue)
        shell: bash
        run: |
          set +e
          python -m investment_attribution corporate-actions --method fifo \
            --ledger out/ledger.json --out-dir out/ca-fifo
          code=$?
          test "$code" = "1"
          python -m investment_attribution corporate-actions --method wavg \
            --ledger out/ledger.json --out-dir out/ca-wavg
          code=$?
          test "$code" = "1"
          test -f out/ca-fifo/actions.json
          test -f out/ca-fifo/pending.json

      - name: Corporate-actions method is mandatory (exit 2)
        shell: bash
        run: |
          set +e
          python -m investment_attribution corporate-actions --ledger out/ledger.json
          code=$?
          test "$code" = "2"

      - name: Attribution smoke (both methods x both TWR bases; no benchmark -> exit 0)
        shell: bash
        run: |
          # 估值样例覆盖"成本场景四件套"，故归因演示必须导入同一组流水
          python -m investment_attribution import \
            data/samples/htsec-demo-001.xlsx data/samples/huaxi-demo-001.xls \
            data/samples/generic-demo-013-account-c.csv \
            data/samples/generic-demo-015-no-fee-columns.csv --out-dir out/attr-src/
          python -m investment_attribution attribution --method fifo \
            --ledger out/attr-src/ledger.json \
            --valuation data/samples/valuation-demo-001.csv --out-dir out/attr-fifo
          test -f out/attr-fifo/attribution.json
          python -m investment_attribution attribution --method wavg \
            --ledger out/attr-src/ledger.json \
            --valuation data/samples/valuation-demo-001.csv \
            --twr-basis daily --xirr --twr --out out/attr-wavg/attribution.json
          test -f out/attr-wavg/attribution.json

      - name: Attribution method and inputs are mandatory (exit 2)
        shell: bash
        run: |
          set +e
          python -m investment_attribution attribution --ledger out/attr-src/ledger.json \
            --valuation data/samples/valuation-demo-001.csv
          test "$?" = "2"
          python -m investment_attribution attribution --method fifo \
            --ledger out/attr-src/ledger.json
          test "$?" = "2"
          python -m investment_attribution attribution --method fifo \
            --ledger out/attr-src/ledger.json \
            --valuation data/samples/valuation-demo-001.csv --twr-basis monthly
          test "$?" = "2"

      - name: Merge smoke (exit 0 = transfers offset, totals conserved)
        shell: bash
        run: |
          python -m investment_attribution merge --method fifo \
            --ledger out/attr-src/ledger.json \
            --attribution out/attr-fifo/attribution.json --out-dir out/merged
          test -f out/merged/merged.json

      - name: Report smoke (single file, zero external links, masked accounts)
        shell: bash
        run: |
          python -m investment_attribution report \
            --merged out/merged/merged.json --out-dir out/report
          test -f out/report/report.html
          test -f out/report/report_data.json
          # 零外链：报告里不得出现任何外部地址引用
          ! grep -qE 'https?:|//' out/report/report.html
          # 报告阶段打码：HTML / JSON 不含完整账号形态
          ! grep -qE '[YA][0-9]{7,9}' out/report/report.html
          ! grep -qE '[YA][0-9]{7,9}' out/report/report_data.json

      - name: Merge method and inputs are mandatory (exit 2)
        shell: bash
        run: |
          set +e
          python -m investment_attribution merge --ledger out/attr-src/ledger.json \
            --attribution out/attr-fifo/attribution.json
          test "$?" = "2"
          python -m investment_attribution merge --method fifo \
            --attribution out/attr-fifo/attribution.json
          test "$?" = "2"
          python -m investment_attribution merge --method fifo \
            --ledger out/attr-src/ledger.json
          test "$?" = "2"
          python -m investment_attribution report
          test "$?" = "2"

      - name: Run smoke (one command, whole chain; exit 1 = pending corporate action)
        shell: bash
        run: |
          set +e
          python -m investment_attribution run \
            data/samples/htsec-demo-001.xlsx data/samples/huaxi-demo-001.xls \
            data/samples/generic-demo-013-account-c.csv \
            data/samples/generic-demo-015-no-fee-columns.csv \
            --method fifo --valuation data/samples/valuation-demo-001.csv \
            --out-dir out/chain
          code=$?
          test "$code" = "1"
          for name in ledger.json holdings.json pnl.json actions.json pending.json \
                      attribution.json merged.json report.html report_data.json; do
            test -f "out/chain/$name" || { echo "missing out/chain/$name"; exit 1; }
          done

      - name: Bench suites B1-B5 (exit 0 = all suites meet their truth)
        shell: bash
        run: |
          python -m investment_attribution bench
          python -m investment_attribution bench --only B1
          set +e
          python -m investment_attribution bench --only B9
          test "$?" = "2"
